[project]
name = "study-plan-quiz-agent"
version = "0.1.0"
description = "Personalized Study Plan & Quiz Agent — multi-agent system built with the OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "openai-agents>=0.0.19",
    "openai>=1.78.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
study   = "main:main"
history = "history:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
